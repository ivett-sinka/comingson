<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinka Ivett - UI/UX és webdesign</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Geometric line pattern background -->
    <div class="background-pattern"></div>

    <!-- Logo -->
    <div class="logo">
        <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 0C60 33.1371 33.1371 60 0 60V120C66.2742 120 120 66.2742 120 0H60Z" fill="url(#gradient)"/>
            <defs>
                <linearGradient id="gradient" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#B14DC7"/>
                    <stop offset="100%" stop-color="#7C3E9E"/>
                </linearGradient>
            </defs>
        </svg>
    </div>

    <!-- Main content -->
    <div class="container">
        <div class="greeting-small">
            <span id="greeting" class="greeting-text"></span><span class="comma">,</span><span class="cursor">|</span>
        </div>

        <h1 class="main-heading">Sinka Ivett vagyok</h1>

        <p class="subtitle">A weboldalam készül, hamarosan találkozunk!</p>

        <div class="divider"></div>

        <p class="description">
            Brand stratégiától a kész felületig átgondolt dizájnnal fogom átalakítani<br>
            digitális jelenléted.
        </p>

        <div class="specialization">
            <span class="line-left"></span>
            <span class="text">UI/UX és webdesign</span>
            <span class="line-right"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
