<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SI – Portfólió</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --clr-bg: #0f0f0f;
      --clr-surface: #1a1a1a;
      --clr-accent: #c8a96e;
      --clr-text: #f0ede8;
      --clr-muted: #888;
      --nav-height: 72px;
      --breakpoint: 968px;
    }

    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER / NAV ─────────────────────────────────── */
    header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 300; /* must be above mobile-menu (150) so hamburger/X stays visible */
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200, 169, 110, 0.12);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
      height: var(--nav-height);
    }

    .nav-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    /* ── DESKTOP LINKS ───────────────────────────────── */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--clr-text);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.25s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      inset: auto 0 0 0;
      height: 1px;
      background: var(--clr-accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--clr-accent);
    }

    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ── HAMBURGER BUTTON ────────────────────────────── */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 50px;
      height: 50px;
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      /* no z-index needed here – the parent header (z-index:300) handles stacking */
    }

    .hamburger .bar {
      display: block;
      width: 28px;
      height: 2.5px;
      background: var(--clr-text);
      border-radius: 4px;
      transform-origin: center;
      /*
        gap = 6px, bar height = 2.5px
        center-to-center distance between bar1 and bar3:
          (2.5/2) + 6 + 2.5 + 6 + (2.5/2) = 17px  →  half = 8.5px
      */
      transition:
        transform 0.45s cubic-bezier(0.23, 1, 0.32, 1),
        opacity   0.2s  ease;
    }

    /* ── X state ── */
    /* bar 1 slides down 8.5px to the center, then rotates 45° */
    .hamburger.open .bar:nth-child(1) {
      transform: translateY(8.5px) rotate(45deg);
    }

    /* bar 2 fades out – no scale so there's no width-collapse artifact */
    .hamburger.open .bar:nth-child(2) {
      opacity: 0;
      transition:
        opacity   0.15s ease,
        transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* bar 3 slides up 8.5px to the center, then rotates -45° */
    .hamburger.open .bar:nth-child(3) {
      transform: translateY(-8.5px) rotate(-45deg);
    }

    /* ── MOBILE OVERLAY MENU ─────────────────────────── */
    .mobile-menu {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--clr-bg);
      z-index: 150;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 2.5rem;
      transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      overflow-y: auto;
    }

    .mobile-menu.open {
      transform: translateX(0);
    }

    /* decorative accent line */
    .mobile-menu::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      bottom: 15%;
      width: 3px;
      background: linear-gradient(to bottom, transparent, var(--clr-accent), transparent);
      border-radius: 0 2px 2px 0;
    }

    .mobile-nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .mobile-nav-links li {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .mobile-nav-links li:first-child {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .mobile-nav-links a {
      display: block;
      padding: 1.35rem 0.5rem;
      text-decoration: none;
      color: var(--clr-text);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.25s, padding-left 0.3s ease;
    }

    .mobile-nav-links a:hover {
      color: var(--clr-accent);
      padding-left: 1rem;
    }

    /* ── CONTACT INFO (mobile only) ──────────────────── */
    .mobile-contact {
      margin-top: 2.5rem;
      padding-left: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .mobile-contact a {
      text-decoration: none;
      color: var(--clr-muted);
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      transition: color 0.25s;
    }

    .mobile-contact a:hover {
      color: var(--clr-accent);
    }

    .mobile-contact .contact-label {
      display: inline-block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--clr-accent);
      margin-bottom: 0.2rem;
    }

    /* ── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 968px) {
      .nav-links {
        display: none;
      }

      .hamburger {
        display: flex;
      }
    }

    @media (min-width: 969px) {
      .mobile-menu {
        display: none;
      }
    }

    /* ── DEMO CONTENT ────────────────────────────────── */
    main {
      padding-top: calc(var(--nav-height) + 4rem);
      max-width: 1280px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
      min-height: 100vh;
    }

    main h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 200;
      letter-spacing: 0.05em;
      color: var(--clr-text);
    }

    main h1 span {
      color: var(--clr-accent);
    }

    /* ── PORTFOLIO SECTION ───────────────────────────── */
    .portfolio-section {
      margin-top: 4rem;
    }

    .portfolio-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .portfolio-row-top,
    .portfolio-row-bottom {
      display: grid;
      gap: 0.75rem;
    }

    .portfolio-row-top {
      grid-template-columns: repeat(4, 1fr);
    }

    .portfolio-row-bottom {
      grid-template-columns: repeat(2, 1fr);
    }

    /* ── P-ITEM: hover overlay (::after) + plus button (::before) ── */
    .p-item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-radius: 3px;
    }

    .p-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(0%) brightness(1);
      transition: filter 0.4s ease;
    }

    /* dark greyscale overlay */
    .p-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 15, 0);
      transition: background 0.4s ease;
      pointer-events: none;
      z-index: 2;
    }

    /* + button */
    .p-item::before {
      content: '+';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      z-index: 3;
      width: 52px;
      height: 52px;
      border: 1.5px solid var(--clr-accent);
      border-radius: 50%;
      color: var(--clr-accent);
      font-size: 2rem;
      font-weight: 200;
      line-height: 50px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    .p-item:hover img {
      filter: grayscale(90%) brightness(0.55);
    }

    .p-item:hover::after {
      background: rgba(15, 15, 15, 0.45);
    }

    .p-item:hover::before {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ── PORTFOLIO RESPONSIVE ────────────────────────── */
    @media (max-width: 968px) {
      .portfolio-row-top {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .portfolio-row-top {
        grid-template-columns: repeat(2, 1fr);
      }
      .portfolio-row-bottom {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ── LIGHTBOX ────────────────────────────────────── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    #lightbox.active {
      opacity: 1;
      pointer-events: all;
    }

    #lb-img {
      max-width: min(90vw, 1100px);
      max-height: 88vh;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      transition: opacity 0.22s ease;
    }

    /* shared button base */
    .lb-btn {
      position: fixed;
      width: 48px;
      height: 48px;
      background: none;
      border: 1px solid rgba(240, 237, 232, 0.18);
      border-radius: 50%;
      cursor: pointer;
      color: var(--clr-text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
      z-index: 501;
    }

    .lb-btn:hover {
      border-color: var(--clr-accent);
      color: var(--clr-accent);
    }

    .lb-close {
      top: 1.5rem;
      right: 1.5rem;
    }

    .lb-close:hover {
      transform: rotate(90deg);
    }

    .lb-prev {
      top: 50%;
      left: 1.5rem;
      transform: translateY(-50%);
    }

    .lb-next {
      top: 50%;
      right: 1.5rem;
      transform: translateY(-50%);
    }

    .lb-prev:hover {
      transform: translateY(-50%) translateX(-3px);
      border-color: var(--clr-accent);
      color: var(--clr-accent);
    }

    .lb-next:hover {
      transform: translateY(-50%) translateX(3px);
      border-color: var(--clr-accent);
      color: var(--clr-accent);
    }

    @media (max-width: 600px) {
      .lb-btn {
        width: 40px;
        height: 40px;
      }
      .lb-prev { left: 0.5rem; }
      .lb-next { right: 0.5rem; }
      .lb-close { top: 1rem; right: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="nav">
      <a href="#">
        <img
          src="https://www.figma.com/api/mcp/asset/ddc14c15-15a1-4460-b878-e48f296bde61"
          alt="SI logo"
          class="nav-logo"
        >
      </a>

      <!-- Desktop links -->
      <ul class="nav-links">
        <li><a href="#about">Rólam</a></li>
        <li><a href="#portfolio">Portfólió</a></li>
        <li><a href="#contact">Kapcsolat</a></li>
      </ul>

      <!-- Hamburger trigger -->
      <button class="hamburger" aria-label="Menü megnyitása" aria-expanded="false" aria-controls="mobileMenu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </nav>
  </header>

  <!-- Mobile overlay menu -->
  <nav class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <ul class="mobile-nav-links">
      <li><a href="#about"   class="mobile-link">Rólam</a></li>
      <li><a href="#portfolio" class="mobile-link">Portfólió</a></li>
      <li><a href="#contact"  class="mobile-link">Kapcsolat</a></li>
    </ul>

    <div class="mobile-contact">
      <span class="contact-label">Elérhetőség</span>
      <a href="tel:+36301234567">+36 30 123 4567</a>
      <a href="mailto:hello@example.com">hello@example.com</a>
    </div>
  </nav>

  <main>
    <h1>Szia, <span>itt a nevem</span></h1>

    <section id="portfolio" class="portfolio-section">
      <div class="portfolio-grid">
        <!-- Row 1 – 4 images -->
        <div class="portfolio-row-top">
          <div class="p-item">
            <img src="img/illustration-dilanda.jpg" alt="Dilanda portré digitális illusztráció">
          </div>
          <div class="p-item">
            <img src="img/illustration-csaladi-portre.jpg" alt="Családi portré digitális illusztráció">
          </div>
          <div class="p-item">
            <img src="img/illustration-nagyszulok.jpg" alt="Nagyszülőknél digitális illusztráció">
          </div>
          <div class="p-item">
            <img src="img/illustration-terapia.jpg" alt="Terápia digitális illusztráció">
          </div>
        </div>
        <div class="portfolio-row-top">
          <div class="p-item">
            <img src="img/illustration-juhász.jpg" alt="Juhász portré grafitceruza rajz">
          </div>
          <div class="p-item">
            <img src="img/illustration-kutya-portre.jpg" alt="Kutya portré grafitceruza rajz">
          </div>
          <div class="p-item">
            <img src="img/illustration-ugro.jpg" alt="Ugró ló digitális illusztráció">
          </div>
          <div class="p-item">
            <img src="img/illustration-konyv-borito.jpg" alt="Könyvborító digitális illusztráció">
          </div>
        </div>
        <!-- Row 2 – 2 images -->
        <div class="portfolio-row-bottom">
          <div class="p-item">
            <img src="img/Illusztration-depeche.jpg" alt="Depeche Mode portré digitális illusztráció">
          </div>
          <div class="p-item">
            <img src="img/illustration-kismadár.jpg" alt="Kismadár digitális illusztráció">
          </div>
        </div>
        <div class="portfolio-row-bottom">
          <div class="p-item">
            <img src="img/illustration-róka.jpg" alt="Róka grafitceruza rajz">
          </div>
          <div class="p-item">
            <img src="img/illustration-vaddiszno.jpg" alt="Vaddisznó grafitceruza rajz">
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Képnézegető">
    <!-- Close button – X (hamburger-stílusú vékony vonalak) -->
    <button class="lb-btn lb-close" id="lb-close" aria-label="Bezárás">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="1.5" y1="1.5" x2="16.5" y2="16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16.5" y1="1.5" x2="1.5" y2="16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Prev arrow – bal chevron -->
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Előző kép">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="11,3 5,9 11,15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <img id="lb-img" src="" alt="">

    <!-- Next arrow – jobb chevron -->
    <button class="lb-btn lb-next" id="lb-next" aria-label="Következő kép">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="7,3 13,9 7,15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    function openMenu() {
      hamburger.classList.add('open');
      mobileMenu.classList.add('open');
      hamburger.setAttribute('aria-expanded', 'true');
      mobileMenu.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      mobileMenu.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', () => {
      mobileMenu.classList.contains('open') ? closeMenu() : openMenu();
    });

    // close when a link is clicked
    mobileLinks.forEach(link => link.addEventListener('click', closeMenu));

    // close on Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeMenu();
    });

    /* ── LIGHTBOX ────────────────────────────────────── */
    const pItems  = [...document.querySelectorAll('.p-item')];
    const lbImages = pItems.map(item => item.querySelector('img'));
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lb-img');
    let lbIndex    = 0;

    function lbOpen(index) {
      lbIndex = index;
      lbImg.src = lbImages[index].src;
      lbImg.alt = lbImages[index].alt;
      lbImg.style.opacity = '1';
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function lbClose() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function lbNavigate(dir) {
      lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
      lbImg.style.opacity = '0';
      setTimeout(() => {
        lbImg.src = lbImages[lbIndex].src;
        lbImg.alt = lbImages[lbIndex].alt;
        lbImg.style.opacity = '1';
      }, 220);
    }

    pItems.forEach((item, i) => item.addEventListener('click', () => lbOpen(i)));

    document.getElementById('lb-close').addEventListener('click', lbClose);
    document.getElementById('lb-prev').addEventListener('click', () => lbNavigate(-1));
    document.getElementById('lb-next').addEventListener('click', () => lbNavigate(1));

    // kattintás a háttérre → bezár
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) lbClose();
    });

    // billentyűzet
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape')     lbClose();
      if (e.key === 'ArrowLeft')  lbNavigate(-1);
      if (e.key === 'ArrowRight') lbNavigate(1);
    });
  </script>

</body>
</html>
