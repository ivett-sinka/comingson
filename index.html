<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComingSon - Animated Greeting</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated background shapes -->
    <div class="background">
        <div class="shape circle circle-1"></div>
        <div class="shape circle circle-2"></div>
        <div class="shape circle circle-3"></div>
        <div class="shape square square-1"></div>
        <div class="shape square square-2"></div>
        <div class="shape triangle triangle-1"></div>
        <div class="shape triangle triangle-2"></div>
        <div class="shape line line-1"></div>
        <div class="shape line line-2"></div>
        <div class="shape line line-3"></div>
    </div>

    <!-- Main content -->
    <div class="container">
        <div class="greeting-wrapper">
            <h1 class="greeting" id="greeting"></h1>
            <span class="cursor">|</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
